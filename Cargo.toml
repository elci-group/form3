[package]
name = "form3"
version = "0.1.1"
edition = "2021"
description = "Dependency-free ANSI terminal styling, tables, and animation primitives"
license = "MIT"

[features]
default = []
cjk = []
agent = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }

[dev-dependencies]
crossterm = "0.29"
